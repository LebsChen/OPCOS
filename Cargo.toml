[workspace]
resolver = "2"
members = [
  "crates/opcos-computer-use",
  "crates/opcos-hosts",
  "crates/opcos-lsp",
  "crates/opcos-rvm",
  "crates/opcos-provider",
  "crates/opcos-engine",
  "crates/opcos-policy",
  "crates/opcos-store",
  "crates/opcos-mcp",
  "crates/opcos-mcp-server",
  "crates/opcos-acp-server",
  "crates/opcos-assets",
  "crates/opcos-eval",
  "src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
opcos-computer-use = { path = "crates/opcos-computer-use" }
enigo = "0.6.1"
xcap = "=0.9.7"
x11rb = "0.13"
anyhow = "1"
async-trait = "0.1"
opcos-mcp-server = { path = "crates/opcos-mcp-server" }
opcos-acp-server = { path = "crates/opcos-acp-server" }
agent-client-protocol = "2.0.0"
opcos-hosts = { path = "crates/opcos-hosts" }
aws-config = "1"
aws-sdk-bedrockruntime = "1.138.0"
aws-sdk-bedrock = "1.150.0"
aws-types = "1"
aws-smithy-types = "1"
bytes = "1"
png = "0.17"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures-util = "0.3"
imap = "2.4.1"
keyring = { version = "3", default-features = false, features = [
    "sync-secret-service",
    "apple-native",
    "windows-native",
] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
regex = "1"
ring = "0.17"
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "io-std", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
notify = "8"
native-tls = "0.2"
getrandom = "0.3"
subtle = "2"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rhai = { version = "=1.25.1", default-features = false, features = ["std", "sync", "serde", "no_module", "no_custom_syntax"] }
