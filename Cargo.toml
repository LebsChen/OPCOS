[workspace]
resolver = "2"
members = [
  "crates/opcos-hosts",
  "crates/opcos-rvm",
  "crates/opcos-provider",
  "crates/opcos-engine",
  "crates/opcos-policy",
  "crates/opcos-store",
  "crates/opcos-mcp",
  "crates/opcos-assets",
  "crates/opcos-cloud-broker",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
opcos-cloud-broker = { path = "crates/opcos-cloud-broker" }
anyhow = "1"
async-trait = "0.1"
opcos-hosts = { path = "crates/opcos-hosts" }
aws-config = "1"
aws-sdk-bedrockruntime = "1.138.0"
aws-sdk-bedrock = "1.150.0"
aws-types = "1"
aws-smithy-types = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
keyring = { version = "3", default-features = false, features = [
    "sync-secret-service",
    "apple-native",
    "windows-native",
] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "form", "query"] }
ring = "0.17"
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
notify = "8"
getrandom = "0.3"
subtle = "2"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
